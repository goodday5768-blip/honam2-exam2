<style>
:root{--bg:#f8f7f3;--ink:#2a2838;--mute:#6f6d82;--line:#e8e6ef;--h1:#dff0ea;--h2:#e9f6f2;--ht:#22695e;--ng:#b5534a}

#app{max-width:1200px;margin:0 auto}
.lock{padding:26px 16px;max-width:520px;margin:0 auto}.lock h1{font-size:calc(25px*var(--fz,1));margin:6px 0;color:var(--ht)}.sub{color:var(--mute);font-size:calc(16px*var(--fz,1));margin:0 0 14px}
.note{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(70,60,120,.08)}
.btn{font:inherit;font-weight:800;border:0;background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht)}

.home{padding:18px 14px 50px}.hh{font-size:calc(20px*var(--fz,1));font-weight:900;margin:8px 4px 12px}.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:block;text-decoration:none;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(70,60,120,.09)}.gc b{display:block;font-size:calc(26px*var(--fz,1));line-height:1.25}.gc span{font-size:calc(16px*var(--fz,1));font-weight:600}
.res{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;font-weight:800;text-decoration:none;color:inherit}.res em{margin-left:auto;font-style:normal;color:var(--ht)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht);box-shadow:0 2px 8px rgba(70,60,120,.10);display:flex;align-items:center;gap:10px;padding:9px 12px}.top b{font-size:calc(20px*var(--fz,1));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk{background:rgba(255,255,255,.7);color:var(--ht);font-size:calc(16px*var(--fz,1));padding:7px 12px;border-radius:11px;text-decoration:none;font-weight:800}.pn{font-size:calc(15px*var(--fz,1));font-weight:700}
.top{display:block;padding:0}.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:calc(20px*var(--fz,1));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips a{flex:none;font-size:calc(15.5px*var(--fz,1));font-weight:800;cursor:pointer;color:var(--ht);background:rgba(255,255,255,.6);border-radius:999px;padding:5px 13px;white-space:nowrap}
main{padding:12px 8px 60px}article{background:#fff;border-radius:20px;margin:0 0 26px;overflow:hidden;box-shadow:0 4px 16px rgba(70,60,120,.08);scroll-margin-top:106px}
.ah{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht);padding:14px 18px}.lb{display:inline-block;background:rgba(255,255,255,.7);font-size:calc(17px*var(--fz,1));font-weight:900;border-radius:9px;padding:2px 12px;margin-bottom:6px}.ah .k{font-size:calc(23px*var(--fz,1));font-weight:900;line-height:1.35}.ah .e{font-size:calc(17px*var(--fz,1));opacity:.96;line-height:1.4;margin-top:2px}
.sm{background:#fff9e8;border-bottom:2px solid #f3e0ae;padding:13px 18px;font-size:calc(20px*var(--fz,1));font-weight:700;line-height:1.55;color:#5a4a1c}.sm span{display:inline-block;background:#fae0c8;color:#8a5020;font-size:calc(15px*var(--fz,1));font-weight:900;border-radius:999px;padding:2px 12px;margin-right:8px;vertical-align:2px}
.pg{background:#fff;position:relative}.pg:before{content:'불러오는 중…';position:absolute;left:18px;top:14px;color:#8aa39b;font-size:calc(16px*var(--fz,1))}.pg img{display:block;position:relative;width:100%;height:100%;background:#fff}.pg img:not([src]){opacity:0}

   D.enc = base64(iv + AES-256-GCM(gzip JSON)). 열쇠(16진수 64자)는 서버 start 응답 g.key 또는 이 기기에 저장된 값.

   음원(2026-11-02): <audio data-enc="경로.bin" data-type="audio/mp4"> 도 같은 방식(보일 때 받아 풀어 src). */

  const MSG_SRV = '지금은 시작할 수 없습니다. 선생님께 문의하세요.';
  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
